services:
  - type: web
    name: gaming-event-ticketing
    runtime: node
    buildCommand: npm install
    startCommand: node backend/server.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: gaming-event-ticketing-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
databases:
  - name: gaming-event-ticketing-db
    databaseName: gaming_events
    user: gaming_admin
